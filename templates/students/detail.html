{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col p-3">
        <div class="card">
            <form id="student_form" action="{{ url_for('students.edit_student', student_id=student.student_id) }}" method="post" enctype="multipart/form-data">
                <div class="card-header">
                    ข้อมูลนักเรียน
                </div>

                <div class="card-body">
                    {% include 'students/form.html' %}
                </div>

                <div class="card-footer">
                    <button id="save_button" type="submit" class="btn btn-primary" style="display: none;">บันทึก</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function () {
        const saveButton = $('#save_button');
        const studentForm = $('#student_form');

        // Initially hide the save button
        saveButton.hide();

        // Show the save button when there's a change in the form
        studentForm.on('change', function () {
            saveButton.show();
        });
    });
</script>
{% endblock %}
